/* record a payment against a PO */
function openPay(p) {
  const cur = p.currency || 'USD', inDir = p.dir === 'import' ? 'out' : 'in', bal = poBal(p);
  const pt = partnerByName(p.partnerName);
  const cands = S.txns.filter(t => !t.poId && t.dir === inDir && (t.date || '') >= addDays(todayStr(), -180))
    .map(t => { const mp = matchPartner(t.counterparty); return { t, score: (mp && pt && mp.id === pt.id) ? 2 : (t.category === (inDir === 'in' ? 'sales' : 'purchase') || t.category === 'advance') ? 1 : 0 }; })
    .sort((a, b) => b.score - a.score || (b.t.date || '').localeCompare(a.t.date || '')).slice(0, 15);
  const est = t => { const tc = t.currency || 'KRW'; if (tc === cur) return num(t.amount); const b = toBase(num(t.amount), tc), r = num((S.co.fx || {})[cur]); if (cur === BASE() && b !== null) return Math.round(b * 100) / 100; if (b !== null && r > 0) return Math.round(b / r * 100) / 100; return ''; };
  const tgt = inDir === 'out' ? payTarget(p) : null;
  const body = `${tgt && (tgt.b || p.supBank) ? `<div class="bank-card" style="border:1px solid var(--line);border-radius:var(--r-sm)"><div class="row-t">지급할 계좌</div><div class="acct mono">${esc(tgt.b ? tgt.b.account : '')}</div><div class="row-s" style="white-space:pre-line">${esc(tgt.b ? [tgt.b.bankName, tgt.b.holder || (tgt.pt && tgt.pt.name), tgt.b.swift].filter(Boolean).join(' · ') : p.supBank)}</div><div class="actions"><button class="btn btn-s btn-p" data-act="copy-pay" data-id="${esc(p.id)}">이체 정보 복사</button></div></div>` : ''}<dl class="kv2"><dt>거래처</dt><dd>${esc(p.partnerName || '')}</dd><dt>${isBill(p) ? '청구서' : 'PO'}</dt><dd class="mono">${esc(p.no || '')}</dd><dt>총액</dt><dd class="mono">${money(poTotal(p), cur)}</dd><dt>결제됨</dt><dd class="mono">${money(poPaid(p), cur)}</dd><dt>남은 금액</dt><dd class="mono"><b>${money(bal, cur)}</b></dd></dl>
    <div class="rel"><div class="rel-h"><span>통장 기록에서 연결</span><span class="muted" style="font-weight:500">아직 연결 안 된 ${inDir === 'in' ? '입금' : '출금'}</span></div>
    ${cands.length ? cands.map(({ t }) => { const same = (t.currency || 'KRW') === cur; return `<div class="prow"><div style="min-width:0"><div class="row-t">${esc(t.counterparty || t.memo || '-')}${t.category ? `<span class="chip">${esc(CAT_LABEL[t.category] || '')}</span>` : ''}</div><div class="row-s">${fmtDF(t.date)} · ${esc(t.bank || '')}</div></div>
      <div class="row-r"><span class="amt ${t.dir === 'in' ? 'amt-in' : ''}">${money(num(t.amount), t.currency || 'KRW')}</span></div>
      <div class="acts" style="align-items:center">${same ? '' : `<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)">${cur} 기준<input class="in mono" id="pa-${esc(t.id)}" type="number" step="any" inputmode="decimal" value="${est(t)}" style="width:130px;min-height:34px"></label>`}<button class="btn btn-s" data-pact="link" data-tid="${esc(t.id)}">여기에 연결</button></div></div>`; }).join('') : '<div class="row-s" style="padding:12px">연결할 만한 통장 기록이 없어요. 문자 붙여넣기나 엑셀로 먼저 불러오세요.</div>'}</div>
    <div class="rel"><div class="rel-h"><span>통장 밖에서 결제된 금액</span></div><div class="prow"><div class="row-s" style="white-space:normal">L/C 네고, 상계, 현금 등 통장 기록이 없는 결제를 ${cur} 기준으로 반영해요.</div><div></div>
      <div class="acts"><input class="in mono" id="pa-extra" type="number" step="any" inputmode="decimal" placeholder="${fmtNum(bal, cur)}" style="width:160px;min-height:34px"><button class="btn btn-s" data-pact="extra">반영</button></div></div></div>`;
  const foot = `<span class="sp"></span><button type="button" class="btn" data-act="sheet-close">닫기</button><button type="button" class="btn btn-p" data-pact="manual">입출금 직접 기록</button>`;
  openSheet(`결제 기록 · ${p.no || ''}`, body, foot, {
    mount: panel => {
      panel.addEventListener('click', async e => {
        const b = e.target.closest('[data-pact]'); if (!b) return;
        const a = b.dataset.pact;
        if (a === 'manual') { closeSheet(); openTxn({ dir: inDir, date: todayStr(), currency: cur, amount: Math.round(bal * 100) / 100, counterparty: p.partnerName || '', category: (isBill(p) && p.category) || (inDir === 'in' ? 'sales' : 'purchase'), poId: p.id, source: 'manual' }); return; }
        if (a === 'extra') { const v = num($('#pa-extra', panel).value); if (!(v > 0)) { toast('금액을 적어 주세요.', 'crit'); return; } b.disabled = true; try { const latest = poById(p.id) || p; await put('pos', Object.assign(JSON.parse(JSON.stringify(latest)), { paidExtra: num(latest.paidExtra) + v })); toast('반영했어요'); closeSheet(); } catch (err) { b.disabled = false; } return; }
        if (a === 'link') {
          const t = S.txns.find(x => x.id === b.dataset.tid); if (!t) return;
          const row = JSON.parse(JSON.stringify(t)); row.poId = p.id;
          if ((t.currency || 'KRW') !== cur) { const v = num(($('#pa-' + t.id, panel) || {}).value); if (!(v > 0)) { toast(`${cur} 기준 금액을 적어 주세요.`, 'crit'); return; } row.poAmt = v; }
          if (!row.category || (isBill(p) && p.category && ['purchase', 'sales', 'etc_out', 'etc_in', 'expense'].includes(row.category))) row.category = (isBill(p) && p.category) || (inDir === 'in' ? 'sales' : 'purchase');
          b.disabled = true; try { await put('txns', row); b.replaceWith(Object.assign(document.createElement('span'), { className: 'chip c-good', textContent: '연결됨' })); toast('연결했어요'); } catch (err) { b.disabled = false; }
        }
      });
    }
  });
}

/* statement of account (对账单) */
const SL = {
  ko: { title: '거래처 원장', to: '거래처', period: '기간', all: '전체 기간', date: '날짜', desc: '내용', amt: '거래 금액', paid: '결제 금액', bal: '잔액', open: '이월 잔액', order: '주문', bill: '청구서', pay: '결제', other: '기타 결제 반영', confirm: '위 내용을 확인하신 뒤 회신 부탁드립니다.', us: '발행', them: '거래처 확인', ar: '받을 금액', ap: '지급할 금액', issued: '작성일' },
  zh: { title: '对账单', to: '往来单位', period: '对账期间', all: '全部', date: '日期', desc: '摘要', amt: '发生金额', paid: '结算金额', bal: '余额', open: '期初余额', order: '订单', bill: '账单', pay: '收付款', other: '其他结算', confirm: '请核对以上账目，如无误请签字盖章后回传。', us: '本公司', them: '对方确认（签字盖章）', ar: '应收账款', ap: '应付账款', issued: '制表日期' },
  en: { title: 'STATEMENT OF ACCOUNT', to: 'To', period: 'Period', all: 'All dates', date: 'Date', desc: 'Description', amt: 'Amount', paid: 'Paid', bal: 'Balance', open: 'Opening balance', order: 'Order', bill: 'Invoice', pay: 'Payment', other: 'Other settlement', confirm: 'Please check the above and return a signed copy to confirm the balance.', us: 'Issued by', them: 'Confirmed by', ar: 'Receivable', ap: 'Payable', issued: 'Date issued' }
};
const langFor = cur => cur === 'CNY' ? 'zh' : cur === 'KRW' ? 'ko' : 'en';
function statementPaper(name, lang, from) {
  const T = SL[lang] || SL.en, co = S.co, key = String(name || '').trim().toLowerCase();
  const fd = s => !s ? '' : lang === 'zh' ? fmtZh(s) : lang === 'ko' ? fmtDF(s) : fmtEn(s);
  const ourName = lang === 'zh' ? (co.nameZh || co.nameEn || co.nameKo) : lang === 'ko' ? (co.nameKo || co.nameEn) : (co.nameEn || co.nameKo);
  const ourAddr = lang === 'zh' ? (co.addressZh || co.addressEn || co.addressKo) : lang === 'ko' ? (co.addressKo || co.addressEn) : (co.addressEn || co.addressKo);
  const groups = {};
  for (const p of S.pos.filter(p => p.status !== 'cancel' && (p.partnerName || '').trim().toLowerCase() === key)) {
    const cur = p.currency || 'USD', side = p.dir === 'import' ? 'ap' : 'ar', k = side + '|' + cur;
    const g = groups[k] = groups[k] || { cur, side, rows: [] };
    const items = (p.items || []).filter(i => i.desc).map(i => i.desc);
    g.rows.push({ date: p.poDate || '', desc: `${isBill(p) ? T.bill : T.order} ${p.no || ''}${items.length ? ' · ' + items[0] + (items.length > 1 ? ` +${items.length - 1}` : '') : ''}`, amt: poTotal(p), paid: 0 });
    for (const t of S.txns.filter(t => t.poId === p.id)) g.rows.push({ date: t.date || '', desc: `${T.pay} · ${p.no || ''}${t.bank ? ' · ' + t.bank : ''}`, amt: 0, paid: (t.currency || 'KRW') === cur ? num(t.amount) : num(t.poAmt) });
    if (num(p.paidExtra)) g.rows.push({ date: p.poDate || '', desc: `${T.other} · ${p.no || ''}`, amt: 0, paid: num(p.paidExtra) });
  }
  const sections = Object.values(groups).map(g => {
    g.rows.sort((a, b) => a.date.localeCompare(b.date));
    let bal = 0; const before = from ? g.rows.filter(r => r.date < from) : [];
    before.forEach(r => { bal += r.amt - r.paid; });
    const vis = from ? g.rows.filter(r => r.date >= from) : g.rows;
    const ta = sumBy(vis, r => r.amt), tp = sumBy(vis, r => r.paid);
    const body = vis.map(r => { bal += r.amt - r.paid; return `<tr><td class="m">${fd(r.date)}</td><td>${nl(r.desc)}</td><td class="r m">${r.amt ? fmtNum(r.amt, g.cur) : ''}</td><td class="r m">${r.paid ? fmtNum(r.paid, g.cur) : ''}</td><td class="r m">${fmtNum(bal, g.cur)}</td></tr>`; }).join('');
    return `<div><div style="font-size:11px;font-weight:700;margin-bottom:4px">${T[g.side]} · ${g.cur}</div><table class="p-items"><thead><tr><th style="width:112px">${T.date}</th><th>${T.desc}</th><th style="width:100px">${T.amt}</th><th style="width:100px">${T.paid}</th><th style="width:108px">${T.bal}</th></tr></thead>
      <tbody>${from ? `<tr><td></td><td>${T.open}</td><td></td><td></td><td class="r m">${fmtNum(sumBy(before, r => r.amt - r.paid), g.cur)}</td></tr>` : ''}${body}</tbody>
      <tfoot><tr><td colspan="2" class="r">${T.bal}</td><td class="r m">${fmtNum(ta, g.cur)}</td><td class="r m">${fmtNum(tp, g.cur)}</td><td class="r m">${money(bal, g.cur)}</td></tr></tfoot></table></div>`;
  });
  const pt = partnerByName(name);
  return `<div class="paper">
    <div class="p-head"><div class="p-co">${co.logo ? `<img src="${esc(co.logo)}" alt="">` : ''}<div><b>${nl(ourName || '')}</b>${nl(ourAddr || '')}${co.tel || co.email ? `\n${nl([co.tel, co.email].filter(Boolean).join('  ·  '))}` : ''}</div></div>
      <div class="p-title">${T.title}<small>${T.issued} ${fd(todayStr())}<br>${T.period} ${from ? `${fd(from)} ~ ${fd(todayStr())}` : T.all}</small></div></div>
    <div class="p-box" style="min-height:0"><label>${T.to.toUpperCase()}</label><b>${nl(name)}</b>${pt && pt.address ? `<div>${nl(pt.address)}</div>` : ''}</div>
    ${sections.join('') || `<div class="mute">—</div>`}
    <div style="font-size:11px">${T.confirm}</div>
    <div class="p-two" style="margin-top:auto"><div class="p-box" style="min-height:110px;position:relative"><label>${T.us}</label><b>${nl(ourName || '')}</b>${co.stamp ? `<img src="${esc(co.stamp)}" alt="" style="position:absolute;right:16px;top:20px;width:76px;height:76px;object-fit:contain;opacity:.92">` : ''}</div><div class="p-box" style="min-height:110px"><label>${T.them}</label><b>${nl(name)}</b></div></div>
  </div>`;
}
function openStmt(name) {
  const names = [...new Set(S.pos.filter(p => p.status !== 'cancel' && p.partnerName).map(p => p.partnerName.trim()))].sort();
  if (!names.length) { toast('PO가 있는 거래처가 아직 없어요.'); return; }
  const first = name && names.includes(name) ? name : names[0];
  const p0 = S.pos.find(p => (p.partnerName || '').trim() === first);
  const body = `${F('거래처', sel('st-name', first, names.map(n => [n, n])))}
    <div class="f"><span>언어</span>${radios('st-lang', langFor(p0 && p0.currency), [['zh', '中文 对账单'], ['en', 'English'], ['ko', '한국어']])}</div>
    ${F('시작일 (비우면 전체 기간)', inp('st-from', '', { type: 'date' }))}
    <div class="prev-box" id="st-prev"></div>`;
  const foot = `<span class="sp"></span><button type="button" class="btn" data-act="sheet-close">닫기</button><button type="button" class="btn btn-p" id="st-pdf">PDF로 저장</button>`;
  openSheet('거래처 원장 · 对账单', body, foot, {
    mount: panel => {
      const box = $('#st-prev', panel);
      const val = () => { const v = readForm(panel); return { name: v['st-name'], lang: v['st-lang'] || 'en', from: v['st-from'] }; };
      const draw = () => { const v = val(); box.innerHTML = statementPaper(v.name, v.lang, v.from); const paper = $('.paper', box); const k = box.clientWidth / 794; paper.style.transform = `scale(${k})`; box.style.height = (paper.offsetHeight * k) + 'px'; };
      panel.addEventListener('change', draw);
      let lw = -1; const ro = new ResizeObserver(() => { if (box.clientWidth !== lw) { lw = box.clientWidth; draw(); } }); ro.observe(box);
      $('#st-pdf', panel).addEventListener('click', e => { const v = val(); htmlToPdf(statementPaper(v.name, v.lang, v.from), `${{ zh: '对账单', en: 'Statement', ko: '거래처원장' }[v.lang]}_${safeName(v.name)}_${todayStr()}.pdf`, e.currentTarget); });
      return () => ro.disconnect();
    }
  });
}

/* payment reminder text */
function remindText(name, lang) {
  const co = S.co, pt = partnerByName(name), key = String(name || '').trim().toLowerCase();
  const items = arapItems().filter(x => x.side === 'ar' && (x.p.partnerName || '').trim().toLowerCase() === key).sort((a, b) => (a.d ?? 99999) - (b.d ?? 99999));
  const tot = {}; items.forEach(x => { tot[x.cur] = (tot[x.cur] || 0) + x.bal; });
  const totS = Object.entries(tot).map(([c, v]) => `${c} ${fmtNum(v, c)}`).join(' / ');
  const b = bankFor(Object.keys(tot)[0] || S.co.defCurrency || 'USD');
  const who = pt && pt.contact ? pt.contact : name;
  const L = [];
  if (lang === 'zh') {
    L.push(`${who} 您好：`, '', '感谢贵司一直以来的支持。以下款项已到期或即将到期，烦请安排付款：');
    items.forEach(x => L.push(`- 订单 ${x.p.no || ''}：${x.cur} ${fmtNum(x.bal, x.cur)}${x.due ? `，到期日 ${fmtZh(x.due.date)}${x.d < 0 ? `（已逾期 ${-x.d} 天）` : ''}` : ''}`));
    L.push(`合计：${totS}`, '');
    if (b.account) L.push(`收款账户：${[b.holder || co.nameZh || co.nameEn, b.bankName, b.account, b.swift ? 'SWIFT ' + b.swift : ''].filter(Boolean).join('，')}`);
    L.push('付款后请将水单发给我们，谢谢！', '', co.nameZh || co.nameEn || co.nameKo || '', [co.tel, co.email].filter(Boolean).join('  '));
  } else if (lang === 'ko') {
    L.push(`${who} 담당자님, 안녕하세요.`, '', '아래 대금의 결제 기한이 지났거나 다가와 안내드립니다.');
    items.forEach(x => L.push(`- 주문 ${x.p.no || ''}: ${money(x.bal, x.cur)}${x.due ? ` (기한 ${fmtDF(x.due.date)}${x.d < 0 ? `, ${-x.d}일 지남` : ''})` : ''}`));
    L.push(`합계: ${totS}`, '');
    if (b.account) L.push(`입금 계좌: ${[b.bankName, b.account, '예금주 ' + (b.holder || co.nameKo)].filter(Boolean).join(' ')}`);
    L.push('확인 부탁드립니다. 감사합니다.', '', `${co.nameKo || co.nameEn || ''} 드림`);
  } else {
    L.push(`Dear ${who},`, '', 'This is a friendly reminder that the following payment(s) are due or overdue:');

/* ---------- task sheet ---------- */
function openTask(pl, t, defaults = {}) {
  const isNew = !t, home = pl;
  t = Object.assign({ id: 't' + uid(), b: (pl.batches || [])[0] ? pl.batches[0].k : '', type: 'task', st: '拟', name: '', start: defaults.d || todayStr(), end: '', qty: '', note: '', mark: '' }, t ? JSON.parse(JSON.stringify(t)) : {}, isNew ? defaults.t || {} : {});
  const codes = [...new Set([...(pl.batches || []).map(b => b.k), ...(pl.tasks || []).map(x => x.b)].filter(Boolean))];
  const pjOpts = S.plans.slice().sort(plOrder).map(p => [p.id, p.name || '이름 없음']);
  const body = `<form class="fgrid" id="pt-task" autocomplete="off">
    ${S.plans.length > 1 ? F('프로젝트', sel('plan', pl.id, pjOpts), 'full') : ''}
    <div class="full">${radios('type', t.type, PL_TYPE)}</div>
    ${F('배치·단계', inp('b', t.b, { list: 'dl-bk', ph: 'A · B+C' }), '', '합친 배치는 B+C처럼')}${F('상태', sel('st', t.st, PL_ST))}
    <datalist id="dl-bk">${codes.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <div class="full" id="tk-name-w">${F('공정 이름', inp('name', t.name, { list: 'dl-steps', ph: 'SMT/AOI, 组装烧录, 测试/品质 …' }), 'full')}</div>
    ${F('시작일', inp('start', t.start, { type: 'date', req: 1 }))}${F('끝나는 날', inp('end', t.end, { type: 'date' }), '', '하루짜리면 비워 두세요')}
    ${F('수량', inp('qty', t.qty, { ph: '约3,000 · 15000' }), '', '验货·出货는 숫자만 쓰면 ‘套’가 붙어요')}${F('표시 (각주)', inp('mark', t.mark, { ph: '¹' }))}
    ${F('메모', inp('note', t.note), 'full')}
  </form>${isNew ? '' : `<div class="actions"><button type="button" class="btn btn-s" id="tk-copy">다음 날로 복사</button><button type="button" class="btn btn-s" id="tk-done">${t.st === 'done' ? '완료 취소' : '완료로 표시'}</button></div>`}`;
  openSheet(isNew ? '작업 추가' : '작업', body, footStd(!isNew), {
    mount: panel => {
      const form = $('#pt-task', panel);
      const sync = () => { const ty = ($('input[name=type]:checked', form) || {}).value; $('#tk-name-w', panel).hidden = ty === 'inspect' || ty === 'ship'; };
      form.addEventListener('change', sync); sync();
      const read = () => { const v = readForm(form); const o = Object.assign(t, { type: v.type || 'task', b: String(v.b || '').toUpperCase().replace(/\s+/g, ''), st: v.st || '拟', name: v.name || '', start: v.start, end: v.end && v.end > v.start ? v.end : '', qty: v.qty || '', note: v.note || '', mark: v.mark || '' }); if (o.type === 'ship' || o.type === 'inspect') o.name = ''; if (/^[\d,]+$/.test(String(o.qty)) && isMile(o)) o.qty = Number(String(o.qty).replace(/,/g, '')); return [o, v.plan || home.id]; };
      const saveIn = async (pid, mut) => { const latest = JSON.parse(JSON.stringify(plById(pid) || home)); latest.tasks = latest.tasks || []; mut(latest.tasks); await put('plans', latest); };
      sheetSave = async () => {
        const [o, pid] = read(); if (!isYmd(o.start)) { toast('시작일을 골라 주세요.', 'crit'); return false; }
        if (o.type === 'task' && !o.name) { toast('공정 이름을 적어 주세요.', 'crit'); return false; }
        if (!isNew && pid !== home.id) { await saveIn(home.id, ts => { const i = ts.findIndex(x => x.id === o.id); if (i >= 0) ts.splice(i, 1); }); }
        await saveIn(pid, ts => { const i = ts.findIndex(x => x.id === o.id); if (i >= 0) ts[i] = o; else ts.push(o); });
        toast(isNew ? '작업을 추가했어요' : '작업을 고쳤어요');
        const ids = plSel().map(p => p.id); if (!ids.includes(pid)) plSetSel([...ids, pid]);
        S.planYm = o.start.slice(0, 7); S.planDay = o.start; return true;
      };
      sheetDelete = async () => { await saveIn(home.id, ts => { const i = ts.findIndex(x => x.id === t.id); if (i >= 0) ts.splice(i, 1); }); toast('작업을 지웠어요'); };
      const cp = $('#tk-copy', panel); if (cp) cp.addEventListener('click', async () => {
        const [o, pid] = read(); const p2 = plById(pid) || home; let nd = addDays(o.start, 1); for (let k = 0; k < 6 && plRest(p2).includes((parseYmd(nd).getDay() + 6) % 7); k++) nd = addDays(nd, 1);
        const span = tEnd(o) !== o.start ? Math.round((parseYmd(tEnd(o)) - parseYmd(o.start)) / 864e5) : 0;
        const c = Object.assign({}, o, { id: 't' + uid(), start: nd, end: span ? addDays(nd, span) : '' });
        try { await saveIn(pid, ts => ts.push(c)); toast(`${fmtD(nd, true)}에 복사했어요`); S.planYm = nd.slice(0, 7); S.planDay = nd; closeSheet(); openTask(plById(pid) || p2, c); } catch (e) { }
      });
      const dn = $('#tk-done', panel); if (dn) dn.addEventListener('click', async () => {
        const [o] = read(); o.st = o.st === 'done' ? '排' : 'done';
        try { await saveIn(home.id, ts => { const i = ts.findIndex(x => x.id === o.id); if (i >= 0) ts[i] = o; }); toast(o.st === 'done' ? '완료로 표시했어요' : '완료를 취소했어요'); closeSheet(); } catch (e) { }
      });
    }
  });
}

/* ---------- plan settings ---------- */
const batRow = b => `<div class="bat-row"><label>코드<input class="in mono" data-bt="k" value="${esc(b.k || '')}" maxlength="6" placeholder="A"></label><label>이름<input class="in" data-bt="name" value="${esc(b.name || '')}" placeholder="在制批 · EVT"></label><label>수량<input class="in mono" data-bt="qty" inputmode="numeric" value="${esc(b.qty ?? '')}" placeholder="15000"></label><button type="button" class="icon-btn" data-bt-del aria-label="배치 지우기">${svg('x')}</button><label class="bat-note">메모<input class="in" data-bt="note" value="${esc(b.note || '')}" placeholder="11/13 出货 · 与 C 合并"></label></div>`;
function openPlanEd(pl) {
  const isNew = !pl;
  pl = Object.assign({ kind: 'prod', title: '生产日历', unit: '套', status: 'active', restDays: [6], batches: [{ k: 'A', name: '', qty: '' }], tasks: [], notes: [], legend: PL_LEGEND }, pl ? JSON.parse(JSON.stringify(pl)) : {});
  const rest = plRest(pl);
  const body = `<form class="fgrid" id="pl-form" autocomplete="off">
    <div class="full">${radios('kind', pl.kind || 'prod', PL_KIND)}</div>
    ${F('제품·프로젝트 이름', inp('name', pl.name, { req: 1, ph: 'FH8333 + SC235HAI' }), 'full')}
    ${F('짧은 이름 (여러 프로젝트를 함께 볼 때)', inp('short', pl.short, { ph: pjShort(Object.assign({}, pl, { short: '' })) }))}${F('제목 (사진·엑셀 머리글)', inp('title', pl.title, { ph: '生产日历 · 开发日程' }))}
    ${F('공장·협력사', inp('partnerName', pl.partnerName, { list: 'dl-partners' }))}${F('고객', inp('customer', pl.customer, { list: 'dl-partners' }))}
    ${F('관련 PO', inp('poNo', pl.poNo, { mono: 1 }))}${F('단위', inp('unit', pl.unit, { ph: '套 · PCS' }))}
    ${F('상태', sel('status', pl.status || 'active', [['active', '진행 중'], ['done', '끝남']]))}
    <div class="f full"><span>쉬는 날 (달력에 休 표시, 일정 옮길 때 건너뛰어요)</span><div class="wd-checks">${PL_WD_KO.split('').map((w, i) => `<label class="check"><input type="checkbox" name="rest${i}" ${rest.includes(i) ? 'checked' : ''}>${w}</label>`).join('')}</div></div>
    <div class="fsec full">배치·단계 · 달력에 A·B·C처럼 색으로 구분돼요</div>
    <div class="full" style="display:flex;flex-direction:column;gap:8px"><div id="bat-list" style="display:flex;flex-direction:column;gap:10px">${(pl.batches || []).map(batRow).join('')}</div><div><button type="button" class="btn btn-s" id="bat-add">${svg('plus')}배치 추가</button></div></div>
    ${F('범례 문구 (사진·엑셀에 들어가요)', ta('legend', pl.legend, 2), 'full')}
  </form>${isNew ? '' : '<div class="actions"><button type="button" class="btn btn-s" id="pl-dup">이 일정 복제해서 새 프로젝트</button></div>'}`;
  openSheet(isNew ? '새 일정' : '일정 설정', body, footStd(!isNew), {
    mount: panel => {
      const form = $('#pl-form', panel), list = $('#bat-list', panel);
      $('#bat-add', panel).addEventListener('click', () => { const used = new Set($$('[data-bt=k]', list).map(i => i.value.trim())); let k = 'A'; while (used.has(k) && k < 'Z') k = String.fromCharCode(k.charCodeAt(0) + 1); list.insertAdjacentHTML('beforeend', batRow({ k })); });
      list.addEventListener('click', e => { if (e.target.closest('[data-bt-del]')) e.target.closest('.bat-row').remove(); });
      form.addEventListener('change', e => { if (e.target.name === 'kind' && !form.elements.title.dataset.touched) form.elements.title.value = e.target.value === 'dev' ? '开发日程' : '生产日历'; });
      form.elements.title.addEventListener('input', e => { e.target.dataset.touched = '1'; });
      const collect = () => {
        const v = readForm(form);
        const batches = $$('.bat-row', list).map(r => { const o = {}; $$('[data-bt]', r).forEach(i => { o[i.dataset.bt] = i.value.trim(); }); o.k = o.k.toUpperCase(); if (/^[\d,]+$/.test(o.qty)) o.qty = Number(o.qty.replace(/,/g, '')); return o; }).filter(b => b.k);
        const restDays = [0, 1, 2, 3, 4, 5, 6].filter(i => v['rest' + i]);
        return { kind: v.kind || 'prod', name: v.name, short: v.short, title: v.title, unit: v.unit || '套', partnerName: v.partnerName, customer: v.customer, poNo: v.poNo, status: v.status, legend: v.legend, batches, restDays };
      };
      sheetSave = async () => {
        const v = collect(); if (!v.name) { toast('이름을 적어 주세요.', 'crit'); return false; }
        const latest = isNew ? pl : JSON.parse(JSON.stringify(plById(pl.id) || pl));

      };
      sheetDelete = async () => { await remove('plans', pl.id); plSetSel((plSelIds() || []).filter(x => x !== pl.id)); S.planId = null; toast('일정을 지웠어요'); };
      const dp = $('#pl-dup', panel); if (dp) dp.addEventListener('click', async () => {
        if (writeBlocked()) return;
        const src = JSON.parse(JSON.stringify(plById(pl.id) || pl)); const c = Object.assign({}, src, collect());
        delete c.id; delete c.createdAt; delete c.updatedAt; c.name = `${c.name} (복사)`; c.short = ''; c.status = 'active';
        c.tasks = (src.tasks || []).map(t => Object.assign({}, t, { id: 't' + uid(), st: t.st === 'done' ? '拟' : t.st })); c.notes = (src.notes || []).slice();
        try { const id = await put('plans', c); plSetSel([id]); S.planId = id; closeSheet(); toast('복제했어요. 이름을 바꾸고 ‘일정 미루기’로 날짜를 옮기세요'); openPlanEd(plById(id) || Object.assign(c, { id })); } catch (e) { }
      });
    }
  });
}
function openPlNote(pl, ym) {

function openPlShift(pl) {
  const bOpts = [['*', '전체'], ...[...new Set([...(pl.batches || []).map(b => b.k), ...(pl.tasks || []).map(t => t.b)].filter(Boolean))].map(k => [k, `${k} ${((pl.batches || []).find(b => b.k === k) || {}).name || ''}`.trim()])];
  const rest = plRest(pl);
  const body = `<div class="banner info"><span>공장 일정이 밀리거나 당겨질 때 써요. 기준일부터 시작하는 작업과 验货·出货를 한꺼번에 옮겨요. 끝난(완료) 작업은 그대로 둬요.</span></div>
    <form class="fgrid" id="sh-form">${F('배치', sel('b', '*', bOpts))}${F('기준일', inp('from', todayStr(), { type: 'date' }))}${F('며칠', inp('n', 1, { type: 'number', step: '1' }), '', '앞당기려면 -2처럼 적어요')}
    ${rest.length ? `<label class="check full"><input type="checkbox" name="skipRest" checked>쉬는 날(${rest.map(i => PL_WD_KO[i]).join('·')})에 걸리면 건너뛰기</label>` : ''}</form><div class="row-s" id="sh-prev"></div>`;
  openSheet(`일정 미루기 · ${pl.name || ''}`, body, footStd(false, '옮기기'), {
    mount: panel => {
      const form = $('#sh-form', panel);
      const pick = v => (pl.tasks || []).filter(t => t.st !== 'done' && (v.b === '*' || t.b === v.b) && t.start >= v.from);
      const prev = () => { const v = readForm(form); $('#sh-prev', panel).textContent = `${pick(v).length}개 작업이 ${num(v.n) >= 0 ? num(v.n) + '일 뒤로' : -num(v.n) + '일 앞으로'} 옮겨져요.`; };
      form.addEventListener('input', prev); form.addEventListener('change', prev); prev();
      sheetSave = async () => {
        const v = readForm(form); const n = Math.round(num(v.n)); if (!n) { toast('며칠 옮길지 적어 주세요.', 'crit'); return false; }
        const latest = JSON.parse(JSON.stringify(plById(pl.id) || pl)); const ids = new Set(pick(v).map(t => t.id));
        const mv = s => { let d = addDays(s, n); for (let k = 0; k < 6 && v.skipRest && rest.includes((parseYmd(d).getDay() + 6) % 7); k++) d = addDays(d, n > 0 ? 1 : -1); return d; };
        latest.tasks.forEach(t => { if (!ids.has(t.id)) return; const span = tEnd(t) !== t.start ? Math.round((parseYmd(tEnd(t)) - parseYmd(t.start)) / 864e5) : 0; t.start = mv(t.start); t.end = span ? addDays(t.start, span) : ''; });
        await put('plans', latest); toast(`${ids.size}개 작업을 옮겼어요`); return true;
      };
    }
  });
}

/* ---------- share: pick projects and months → photo / PDF / Excel ---------- */

      toast(baseChanged ? '저장했어요. 기준 통화가 바뀌어 환율을 다시 넣어 주세요' : '설정을 저장했어요');
    }
  } catch (err) { } finally { if (btn) btn.disabled = false; }
});
document.addEventListener('change', async e => {
  const ds = e.target.dataset || {};
  if (ds.attach) {
    const col = ds.attach, id = ds.id; const list = [...e.target.files]; e.target.value = ''; if (!list.length || !S[col] || !S[col].find(x => x.id === id)) return;
    toast('올리는 중…');
    const up = await uploadFiles(await Promise.all(list.map(f => toJpeg(f)))); if (!up.length) return;
    const rec = JSON.parse(JSON.stringify(S[col].find(x => x.id === id))); rec.files = (rec.files || []).concat(up);
    try { await put(col, rec); const blk = document.getElementById('att-' + id); if (blk) blk.outerHTML = filesBlock(col, rec); toast(`${up.length}개 첨부했어요`); } catch (err) { }
    return;
  }
  if (ds.forms) {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    if (writeBlocked()) return;
    openFormsImport(f); return;
  }
  if (ds.restore) {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try { const data = JSON.parse(await f.text()); if (!data || typeof data !== 'object' || !COLS.some(c => Array.isArray(data[c]))) throw new Error('shape'); openRestore(data); }
    catch (err) { toast('백업 파일을 읽지 못했어요. 이 앱에서 받은 JSON 파일인지 확인해 주세요.', 'crit'); }
    return;
  }
  const k = ds.img; if (!k) return;
  const f = e.target.files[0]; if (!f) return;
  try { const url = k === 'stamp' ? await sealify(f) : await shrinkImage(f, 640); await saveCo({ [k]: url }); toast(k === 'stamp' ? '직인을 올렸어요' : '로고를 올렸어요'); } catch (err) { if (!(err && (err.code || err.message === 'blocked' || err.message === 'too big'))) toast('이미지를 읽지 못했어요.', 'crit'); }
});
window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (ROUTES.has(r) && r !== S.route) { S.route = r; render(); } });

/* ================= boot ================= */
(function boot() {
  const r = location.hash.slice(1); if (ROUTES.has(r)) S.route = r;
  render();
  initData();
})();
</script>
