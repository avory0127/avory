<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AVORY 업무</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<style>html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}
#save-pop{position:fixed;inset:0;z-index:200;background:rgba(10,20,30,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#save-pop .sp-card{background:var(--surface);color:var(--ink);border-radius:16px;padding:18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
#save-pop .sp-name{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}#save-pop .sp-tip{font-size:13px;color:var(--ink-3)}#save-pop .sp-act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
@media (min-width:760px){#save-pop{align-items:center}}</style>
</head><body>
<style>
/* Layout: an operations ledger — sidebar on desktop, bottom tab bar on phone, one column of working panels; trade documents render on white A4 paper */
/* AVORY brand palette: logo navy #092B52, check-mark sky #1E95D3, deep teal for actions. One light theme on purpose. */
:root{
  --bg:#F1F4F7; --surface:#FFFFFF; --surface-2:#F6F8FA; --sunk:#E8EDF2;
  --ink:#0F2236; --ink-2:#435669; --ink-3:#6A7C8E; --line:#D9E1E8; --line-2:#E7ECF1;
  --brand:#092B52; --sky:#1E95D3; --hero:#0F2A3E; --hero-2:#143A52; --mint:#A3E3D9; --mint-ink:#0A2738;
  --accent:#0D5E83; --accent-hi:#0A6F9C; --accent-soft:#E0EEF5; --on-accent:#FFFFFF;
  --steel:#2463A5; --steel-soft:#E3EDF8;
  --good:#1E7A55; --good-soft:#DFF2E8; --warn:#93600A; --warn-soft:#FCF0DA; --crit:#B83232; --crit-soft:#F8E2E2;
  --s-in:#2463A5; --s-out:#C0612B;
  --scrim:rgba(9,25,40,.42); --shadow:0 1px 2px rgba(15,34,54,.05),0 8px 24px rgba(15,34,54,.07);
  --paper:#FFFFFF; --paper-ink:#121212; --paper-rule:#2B2B2B; --paper-hair:#B9B9B9; --paper-shade:#F0F0EE; --paper-mute:#555555;
  --f-ui:"IBM Plex Sans KR","PingFang SC","Noto Sans SC","Apple SD Gothic Neo","Malgun Gothic","Microsoft YaHei","Noto Sans KR",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{text-wrap:balance;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.side{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:30px;height:30px;flex:none;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.mark svg{width:18px;height:18px;stroke:var(--on-accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t span{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.06em}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--sunk)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tab{border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);font-weight:500;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.tab .pip{position:absolute;top:5px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--crit);color:var(--surface);font-size:10px;font-weight:700;line-height:16px;padding:0 4px}
.main{min-width:0;padding-block:20px 112px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
@media (min-width:900px){
  .shell{grid-template-columns:236px minmax(0,1fr)}
  .topbar,.tabbar{display:none}
  body::before{display:none}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px}
  .side .brand{flex:none;padding:4px 8px 18px}
  .nav{border:0;background:none;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;color:var(--ink-2);font-weight:500;text-align:left;width:100%}
  .nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .nav:hover{background:var(--surface-2)}
  .nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .nav .pip{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--crit);color:var(--surface);font-size:11px;font-weight:700;line-height:20px;text-align:center;padding:0 6px}
  .side .grow{flex:1}
  .side-foot{font-size:12px;color:var(--ink-3);padding:8px 12px}
  .main{padding-block:28px 56px}
}


/* ---------- brand shell ---------- */
.logo{display:flex;align-items:center;min-width:0;height:26px}
.logo img{height:24px;width:auto;max-width:150px;object-fit:contain;display:block}
.logo b{font-size:17px;font-weight:700;letter-spacing:.08em;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sep{width:1px;height:18px;background:var(--line);flex:none}
.brand-tag{font-size:11px;letter-spacing:.16em;color:var(--ink-3);white-space:nowrap}
.side .brand{gap:12px;padding:6px 8px 22px}
.side .logo{height:32px}
.side .logo img{height:30px;max-width:130px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5C7A90;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.eyebrow i{display:inline-block;width:26px;height:1px;background:currentColor;opacity:.6}
.dir.im{color:var(--s-out)}
/* ---------- dashboard ---------- */
.hp-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hp-head h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
.date-pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12px;color:var(--ink-2)}
.date-pill i{width:7px;height:7px;border-radius:50%;background:#2BB37B}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:24px 22px 22px;color:#EAF3F8;background:radial-gradient(120% 140% at 100% 0%,var(--hero-2) 0%,var(--hero) 55%,#0B2233 100%)}
.hero-eyebrow{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.2em;color:#8FD6CC;font-weight:600}
.hero-eyebrow i{width:26px;height:1px;background:currentColor}
.hero h2{font-size:clamp(24px,6.4vw,30px);font-weight:700;margin:14px 0 8px;color:#FFFFFF;letter-spacing:-.01em}
.hero p{margin:0;max-width:30ch;font-size:15px;line-height:1.6;color:#C3D4DF}
.hero-act{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;position:relative;z-index:1}
.hero .btn-mint{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
.hero .btn-mint:hover{background:#B6EAE2;border-color:#B6EAE2}
.hero .btn-ghost{background:transparent;border-color:rgba(255,255,255,.34);color:#FFFFFF}
.hero .btn-ghost:hover{border-color:rgba(255,255,255,.7)}
.hero .btn{min-height:46px;padding:0 16px;border-radius:11px;font-size:15px}
.hero-mark{position:absolute;right:-3%;top:clamp(78px,16%,120px);width:min(58%,320px);height:auto;filter:brightness(0) invert(1);opacity:.07;clip-path:inset(0 0 33% 0);pointer-events:none;user-select:none}
.ledger{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ledger>b{font-size:15px;margin-right:2px}
.ledger span{font-size:14px;color:var(--ink-3);white-space:nowrap}
.ledger span b{color:var(--ink);font-weight:700;margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat:hover{border-color:#B9C7D3}
.stat .k{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink-2)}
.stat .k svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.stat .v{font-family:var(--f-mono);font-size:30px;font-weight:600;line-height:1.1;color:var(--ink)}
.stat .v small{font-family:var(--f-ui);font-size:14px;font-weight:500;color:var(--ink-3);margin-left:4px}
.stat .s{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}


/* ---------- home ---------- */
.hero-k{margin-top:16px;font-size:13px;color:#A9C3D2;font-weight:600}
.hero-bal{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:2px;position:relative;z-index:1}
.hero-bal b{font-size:clamp(22px,6.6vw,30px);font-weight:600;color:#FFFFFF;letter-spacing:-.01em}
.hero-none{font-size:14px;color:#C3D4DF}
.hero-rows{display:flex;flex-direction:column;margin-top:16px;border-top:1px solid rgba(255,255,255,.14);position:relative;z-index:1}
.hero-rows button{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border:0;border-bottom:1px solid rgba(255,255,255,.1);background:none;color:#EAF3F8;padding:11px 0;text-align:left;min-width:0}
.hero-rows button:last-child{border-bottom:0}
.hero-rows span{font-size:14px;color:#A9C3D2;white-space:nowrap}
.hero-rows b{font-size:16px;font-weight:600;text-align:right;overflow-wrap:anywhere}
.hero-miss{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;position:relative;z-index:1}
.hero-miss button{border:1px dashed rgba(255,255,255,.4);background:none;color:#CFE6EF;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600}
.qa-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:760px){.qa-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.qa{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2);text-align:center;min-width:0}
.qa:hover{border-color:#B9C7D3;color:var(--ink)}
.qa svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.qa span{line-height:1.3;word-break:keep-all}
.row.sched{grid-template-columns:auto minmax(0,1fr) auto}
.sd{display:flex;flex-direction:column;align-items:center;min-width:52px;padding-right:10px;border-right:1px solid var(--line-2)}
.sd b{font-size:13px;font-weight:600;color:var(--ink)}
.sd small{font-size:11px;color:var(--ink-3)}
.c-out{background:#FBEADF;color:var(--s-out)}
/* ---------- partners ---------- */
.bank-card{padding:14px 16px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:4px}
.list .bank-card:first-child{border-top:0}
.acct{font-size:19px;font-weight:600;letter-spacing:.02em;color:var(--ink);overflow-wrap:anywhere}
.bank-card .actions{margin-top:6px}
.bank-ed{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bank-ed .it-grid{width:100%;grid-template-columns:minmax(0,.7fr) minmax(0,1.6fr) minmax(0,1.6fr)}
@media (max-width:620px){.bank-ed .it-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-flow:row dense}.bank-ed .it-grid .w{grid-column:1/-1}}
.pt-info{padding:0 16px 16px}
.pt-info dd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.pt-info dd .btn{min-height:28px;padding:0 8px;font-size:12px;flex:none}


/* ---------- alert sheet · classify ---------- */
.al-head{display:flex;align-items:center;gap:10px;font-size:17px}
.al-head .sev{flex:none}
.al-sub{font-size:13px;color:var(--ink-3);margin-top:-6px}
.sheet-b>*{flex-shrink:0}
.cls-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.cls-row{padding:12px 14px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.cls-row:first-child{border-top:0}
.cls-row.cls-done{background:var(--good-soft)}
.cls-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cls-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;line-height:1.2}
.chip-btn:hover{border-color:var(--ink-3)}
.chip-btn.sug{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip-btn.ghost{border-style:dashed;color:var(--ink-3)}
.chip-btn[disabled]{opacity:.5}

/* ---------- page parts ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.eyebrow{font-size:12px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px}
.panel-h h2{font-size:15px;font-weight:700}
.panel-h .sub{font-size:12px;color:var(--ink-3)}
.panel-b{padding:0 16px 16px}
.count{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:760px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;padding:12px 14px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--ink);font-size:14px}
.banner.info{background:var(--steel-soft)}
.banner.crit{background:var(--crit-soft)}

/* buttons */
.btn{min-height:40px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-p:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn-s{min-height:34px;padding:0 10px;font-size:13px}
.btn-q{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-q:hover{background:var(--sunk);border-color:transparent}
.btn-danger{color:var(--crit)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink-2);white-space:nowrap;line-height:20px}
.c-good{background:var(--good-soft);color:var(--good)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-crit{background:var(--crit-soft);color:var(--crit)}
.c-steel{background:var(--steel-soft);color:var(--steel)}
.c-acc{background:var(--accent-soft);color:var(--accent)}
.c-ex{background:transparent;border:1px dashed var(--ink-3);color:var(--ink-3);line-height:18px}
.c-cancel{text-decoration:line-through;color:var(--ink-3)}
.dir{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;font-weight:600;padding:0 6px;border-radius:5px;line-height:18px;border:1px solid currentColor}
.dir.ex{color:var(--steel)} .dir.im{color:var(--accent)}

/* segmented */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{flex:1;min-width:160px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px}

/* lists */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 16px;border:0;border-top:1px solid var(--line-2);background:none;text-align:left;width:100%}
.list .row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;min-width:0}
.row-s{font-size:13px;color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.amt.amt-in{color:var(--s-in)}
.paybar{width:84px;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.paybar i{display:block;height:100%;background:var(--good);border-radius:2px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3);font-size:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.day-h{padding:10px 16px 6px;font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.04em;background:var(--surface-2);border-top:1px solid var(--line-2)}
.day-h:first-child{border-top:0;border-radius:var(--r) var(--r) 0 0}

/* alerts */
.alert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;padding:11px 16px;border:0;border-top:1px solid var(--line-2);background:none;width:100%;text-align:left}
.alert:first-child{border-top:0}
.alert:hover{background:var(--surface-2)}
.sev{font-size:11px;font-weight:700;padding:0 7px;border-radius:5px;line-height:20px;margin-top:1px;display:inline-flex;align-items:center;gap:4px}
.sev::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.sev.crit{background:var(--crit-soft);color:var(--crit)}
.sev.warn{background:var(--warn-soft);color:var(--warn)}
.sev.info{background:var(--steel-soft);color:var(--steel)}
.alert b{font-weight:600}
.alert .row-s{white-space:normal}
.alert .when{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);white-space:nowrap;margin-top:2px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:759px){.tiles>.tile:last-child:nth-child(odd){grid-column:1/-1}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.tile .k{font-size:12px;color:var(--ink-3);font-weight:600}
.tile .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:clamp(15px,4.2vw,19px);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* voyages */
.voy{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:0;border-top:1px solid var(--line-2);background:none;width:100%;text-align:left}
.voy:first-child{border-top:0}
.voy:hover{background:var(--surface-2)}
.voy-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.voy-h .l{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.route{display:grid;grid-template-columns:auto minmax(40px,1fr) auto;gap:10px;align-items:center}
.port{font-family:var(--f-mono);font-size:13px;font-weight:600;letter-spacing:.04em}
.track{position:relative;height:2px;background:var(--line)}
.track b{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.track i{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);transform:translate(-50%,-50%)}
.voy-d{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--ink-3)}
.voy-d span b{font-family:var(--f-mono);font-weight:600;color:var(--ink-2);margin-left:4px}

/* start checklist */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:0 16px 16px}
.step{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;text-align:left}
.step .n{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:600}
.step b{font-size:14px}
.step p{margin:0;font-size:13px;color:var(--ink-3)}
.step.done{opacity:.6}
.step.done .n::after{content:" · 완료";color:var(--good)}

/* month nav */
.month{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px}
.month b{min-width:96px;text-align:center;font-size:14px}
.month .icon-btn{width:34px;height:34px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;align-items:flex-end}
.sheet-scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet-p{position:relative;background:var(--surface);width:100%;max-height:94%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:17px;font-weight:700;flex:1;min-width:0}
.sheet-b{overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-f .sp{flex:1}
@media (min-width:760px){
  .sheet{align-items:stretch}
  .sheet-p{width:580px;max-height:none;height:100%;border-radius:0;animation-name:side}
  .sheet-p.wide{width:min(1180px,100%)}
  @keyframes side{from{transform:translateX(24px)}to{transform:none}}
}

/* forms */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:minmax(0,1fr)}.fgrid .half-sm{grid-column:auto}}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.f small{font-size:12px;color:var(--ink-3)}
.in{width:100%;min-height:42px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:8px 11px;font-size:16px;min-width:0}
textarea.in{min-height:84px;resize:vertical;line-height:1.45}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.in.mono{font-family:var(--f-mono)}
.fsec{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line-2);padding-bottom:6px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;min-height:32px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.radio-seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.radio-seg label{flex:1;text-align:center}
.radio-seg input{position:absolute;opacity:0;pointer-events:none}
.radio-seg span{display:block;padding:8px 6px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer}
.radio-seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.radio-seg input:focus-visible+span{outline:2px solid var(--accent)}
.confirm{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--crit);font-weight:600}

/* items editor */
.items-ed{display:flex;flex-direction:column;gap:10px}
.it-list{display:flex;flex-direction:column;gap:10px}
.it-row{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.it-top{display:flex;gap:6px;align-items:center}
.it-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.it-grid label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);min-width:0}
.it-grid .in{min-height:38px;padding:6px 9px}
.it-amt{font-size:13px;color:var(--ink-2);text-align:right}
.it-sum{display:flex;justify-content:space-between;font-weight:700;padding:4px 2px}

/* related blocks in sheets */
.rel{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--surface-2);font-size:13px;font-weight:700}
.rel .row{padding:10px 12px}

/* doc editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.ed-toggle{display:flex;align-self:flex-start}
@media (min-width:1040px){.ed{grid-template-columns:400px minmax(0,1fr)}.ed-toggle{display:none}.ed .ed-form,.ed .ed-prev{display:flex!important}}
.ed-form{display:flex;flex-direction:column;gap:14px;min-width:0}
.ed-prev{display:flex;flex-direction:column;gap:10px;min-width:0}
.ed[data-pane="form"] .ed-prev{display:none}
.ed[data-pane="prev"] .ed-form{display:none}
.prev-box{width:100%;overflow:hidden;border-radius:6px;box-shadow:var(--shadow);background:var(--paper);position:relative}
.prev-box .paper{transform-origin:0 0;position:absolute;left:0;top:0}
.doc-types{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.doc-type{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.doc-type:hover{border-color:var(--accent)}
.doc-type .code{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.06em}
.doc-type b{font-size:15px}
.doc-type span{font-size:12.5px;color:var(--ink-3)}

/* report */
.bars{display:flex;flex-direction:column}
.bar-row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;font-size:14px;border-top:1px solid var(--line-2)}
.bar-row:first-child{border-top:0}
.bar-row .b{height:8px;border-radius:0 4px 4px 0;background:var(--sunk);overflow:hidden}
.bar-row .b i{display:block;height:100%;border-radius:0 4px 4px 0}
.chart-wrap{position:relative;overflow-x:auto}
.chart-wrap svg{display:block;width:100%;min-width:480px;height:auto}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:7px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;box-shadow:var(--shadow)}
.tip b{display:block;margin-bottom:2px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:14px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 8px;border-top:1px solid var(--line-2);text-align:left;white-space:nowrap}
table.t th{font-size:12px;color:var(--ink-3);font-weight:600;border-top:0}
table.t td.r,table.t th.r{text-align:right}
.tscroll{overflow-x:auto}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:var(--shadow);animation:up .2s ease-out}
.toast.crit{background:var(--crit);color:var(--surface)}
@media (min-width:900px){#toast{bottom:28px}}

/* ---------- printed paper (fixed A4, always white) ---------- */
#stage{position:fixed;left:-12000px;top:0;width:794px;pointer-events:none}
.paper{width:794px;min-height:1123px;padding:50px 54px 46px;background:var(--paper);color:var(--paper-ink);font-family:var(--f-ui);font-size:11.5px;line-height:1.45;display:flex;flex-direction:column;gap:14px}
.paper table{width:100%;border-collapse:collapse}
.paper th,.paper td{border:1px solid var(--paper-rule);padding:5px 7px;vertical-align:top;text-align:left;color:var(--paper-ink)}
.paper td{white-space:pre-line}
.paper th{background:var(--paper-shade);font-weight:600;font-size:10.5px}
.paper .r{text-align:right}
.paper .c{text-align:center}
.paper .m{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.paper .mute{color:var(--paper-mute)}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding-bottom:12px;border-bottom:2.5px solid var(--paper-ink)}
.p-co{display:flex;gap:12px;align-items:flex-start;max-width:58%}
.p-co img{max-height:54px;max-width:130px;object-fit:contain}
.p-co b{font-size:15px;display:block;margin-bottom:2px}
.p-co div{font-size:10.5px;line-height:1.5;white-space:pre-line}
.p-title{font-size:23px;font-weight:700;letter-spacing:.07em;text-align:right;line-height:1.15}
.p-title small{display:block;font-size:10.5px;letter-spacing:.02em;font-weight:500;margin-top:6px;color:var(--paper-mute)}
.p-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.p-box{border:1px solid var(--paper-rule);padding:8px 10px;min-height:86px}
.p-box label{display:block;font-size:9.5px;font-weight:700;letter-spacing:.1em;margin-bottom:4px}
.p-box b{display:block;font-size:12.5px}
.p-box div{white-space:pre-line;font-size:11px}
.p-items th{text-align:center}
.p-items td{font-size:11px}
.p-items tfoot td{font-weight:700;background:var(--paper-shade)}
.p-say{font-weight:700;font-size:11px;border-bottom:1px solid var(--paper-hair);padding-bottom:6px}
.p-terms th{width:150px}
.p-sign{display:flex;justify-content:flex-end;margin-top:auto}
.p-sign>div{width:250px;text-align:center;position:relative;padding-top:6px}
.p-sign .who{font-weight:700;font-size:12px}
.p-sign .line{border-top:1px solid var(--paper-ink);margin-top:52px;padding-top:4px;font-size:10.5px}
/* company standard form (AVORY CN/EN) */
.paper.av{--av:#092B52;--av-ink:#152B3E;--av-rule:#C3CDD8;--av-hair:#E1E6EC;--av-sum:#EAF3EF;--av-mute:#566A7F;--av-warn:#B65A17;padding:38px 44px 34px;gap:9px;font-family:"IBM Plex Sans KR","Noto Sans SC",var(--f-ui);font-size:10.5px;line-height:1.4;color:var(--av-ink)}
.av-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.av-logo img{height:50px;width:auto;max-width:210px;object-fit:contain;display:block}
.av-logo b{font-size:26px;letter-spacing:.14em;color:var(--av)}
.av-title{text-align:right;color:var(--av);line-height:1.2}
.av-title b{display:block;font-size:19px;letter-spacing:.08em}
.av-title b.en{font-size:15px;letter-spacing:.06em}
.av-title small{display:block;font-size:9px;color:var(--av-mute);margin-top:3px;font-family:var(--f-mono);letter-spacing:.02em}
.av-co{color:var(--av);font-size:9.8px;line-height:1.55;padding-bottom:7px;border-bottom:2px solid var(--av)}
.av-co b{display:block;font-size:12px}
.av-co b.en{font-size:10.5px;letter-spacing:.02em;margin-bottom:1px}
.paper.av table.avt{table-layout:fixed}
.paper.av .avt th,.paper.av .avt td{border:0;border-bottom:1px solid var(--av-hair);padding:3.5px 6px;font-size:9.8px;line-height:1.3;background:none;color:var(--av-ink);vertical-align:middle;font-weight:400}
.paper.av .avt tbody.info th{color:var(--av)}
.paper.av .avt tbody.info td{font-weight:500}
.paper.av .avt tr.hd th{background:var(--av);color:#fff;font-weight:700;text-align:center;font-size:9.2px;line-height:1.25;border-bottom:0;padding:4px 3px}
.paper.av .avt tr.it td{height:21px;border-bottom:1px solid var(--av-rule)}
.paper.av .avt tr.sum th,.paper.av .avt tr.sum td{color:var(--av)}
.paper.av .avt tr.grand th,.paper.av .avt tr.grand td{background:var(--av-sum);font-weight:700;color:var(--av);border-bottom:1.5px solid var(--av);font-size:10.5px}
.paper.av .avt tr.gap td{border:0;height:6px;padding:0}
.paper.av .avt .sp{color:var(--av-mute);font-size:8.8px}
.av-bank{font-size:9.4px;color:var(--av);line-height:1.6}
.av-note{font-size:9.2px;color:var(--av-warn);line-height:1.5}
.av-sign{display:grid;grid-template-columns:1fr 1fr;gap:28px;color:var(--av);font-size:9.8px;margin-top:4px}
.av-sig{position:relative;height:96px;border-bottom:1px solid var(--av-rule)}
.av-sig img{position:absolute;left:14px;top:-2px;height:112px;width:auto;max-width:190px;object-fit:contain}
.av-blank{height:96px;border-bottom:1px solid var(--av-rule)}
.av-foot{margin-top:auto;font-size:8.8px;color:var(--av-mute);line-height:1.5}
.p-sign img{position:absolute;left:50%;top:14px;width:130px;height:88px;object-fit:contain;transform:translateX(-50%);opacity:.95}
.p-foot{font-size:9.5px;color:var(--paper-mute);text-align:center;border-top:1px solid var(--paper-hair);padding-top:6px}
.k-title{text-align:center;font-size:30px;font-weight:700;letter-spacing:.5em;padding:6px 0 4px;text-indent:.5em}
.k-top{display:grid;grid-template-columns:1fr 1.15fr;gap:16px;align-items:start}
.k-to{display:flex;flex-direction:column;gap:6px;font-size:12px;padding-top:4px}
.k-to .who{font-size:17px;font-weight:700;border-bottom:1.5px solid var(--paper-ink);padding-bottom:4px}
.k-sup th{width:56px;text-align:center;font-size:10.5px}
.k-sup .vert{width:26px;text-align:center;vertical-align:middle;font-size:11px;line-height:1.7}
.k-sup td{font-size:11px}
.seal{position:relative;display:inline-block}
.seal img{position:absolute;right:-30px;top:-20px;width:72px;height:56px;object-fit:contain;opacity:.92}
.k-total{display:flex;align-items:center;gap:14px;border:2px solid var(--paper-ink);padding:9px 12px;font-size:13px}
.k-total b{font-size:15px}

/* added: tiles as buttons, attachments, photo reading, aging, fixed costs */
button.tile{text-align:left;cursor:pointer;font:inherit;color:inherit}
button.tile:hover{border-color:var(--ink-3)}
.tr{font-size:12px;color:var(--ink-3);padding:0 2px}
.att{display:flex;flex-wrap:wrap;gap:12px;padding:12px}
.att:empty{display:none}
.att-i{position:relative;display:flex;flex-direction:column;gap:4px;width:96px;font-size:11px;color:var(--ink-2)}
.att-i .th{width:96px;height:72px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);overflow:hidden;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;color:var(--ink-3);text-decoration:none}
.att-i .th img{width:100%;height:100%;object-fit:cover}
.att-i .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-x{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;font-size:14px;line-height:1;padding:0}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.ocr-card{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2);min-width:0}
.ocr-card h3{font-size:15px}
.kv2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px;margin:0}
.kv2 dt{color:var(--ink-3)}
.kv2 dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pre{white-space:pre-wrap;font-size:14px;line-height:1.6;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:320px;overflow:auto;overflow-wrap:anywhere}
.busy{display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:14px;color:var(--ink-2)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

    ${alerts.length ? `<div class="list">${alerts.slice(0, 10).map(a => `<button class="alert" data-act="alert" data-key="${esc(a.key)}"><span class="sev ${a.sev}">${{ crit: '긴급', warn: '주의', info: '안내' }[a.sev]}</span><span><b>${esc(a.title)}</b><div class="row-s">${esc(a.sub)}</div></span></button>`).join('')}</div>`

    ${ev.length ? `<div class="list">${ev.map(e => `<button class="row sched" data-act="alert" data-key="${esc(e.key)}"><span class="sd mono"><b>${fmtD(e.date)}</b><small>${e.d === 0 ? '오늘' : e.d < 0 ? `${-e.d}일 지남` : `D-${e.d}`}</small></span><div style="min-width:0"><div class="row-t"><span class="chip ${e.tag[1]}">${e.tag[0]}</span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.title)}</span></div><div class="row-s">${esc(e.sub)}</div></div><span class="amt">${esc(e.amt)}</span></button>`).join('')}</div>`
      : '<div class="empty">2주 안에 잡힌 일정이 없어요.</div>'}</section>

    <div style="display:flex;gap:8px;align-items:stretch"><textarea id="quick-in" class="in" rows="2" placeholder="여기에 붙여넣기">${esc(S.quick)}</textarea><button class="btn btn-p" data-act="quick-go">정리</button></div></div></section>
  <div class="grid2">
    <section class="panel"><div class="panel-h"><h2>결제 남은 거래처</h2><button class="btn btn-s btn-q" data-act="go" data-to="partners">전체 거래처</button></div>
      ${owe.length ? `<div class="list">${owe.map(x => `<button class="row" data-act="open-partner" data-id="${esc(x.pt.id)}"><div style="min-width:0"><div class="row-t"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.pt.name)}</span><span class="chip">${PT_SHORT[x.pt.kind] || '기타'}</span></div><div class="row-s">${x.n}건 남음</div></div><div class="row-r">${Object.keys(x.ar).length ? `<span class="amt amt-in">받을 ${esc(curMap(x.ar).join(' · '))}</span>` : ''}${Object.keys(x.ap).length ? `<span class="amt" style="color:var(--s-out)">줄 ${esc(curMap(x.ap).join(' · '))}</span>` : ''}</div></button>`).join('')}</div>`
        : '<div class="empty">결제가 남은 거래처가 없어요.</div>'}</section>
    <section class="panel"><div class="panel-h"><h2>최근 입출금</h2><button class="btn btn-s btn-q" data-act="go" data-to="money">전체 보기</button></div>

  </div>`;
}

function voyage(s) {
  const dep = SH_DEPARTED.has(s.status), arr = SH_ARRIVED.has(s.status);
  let prog = 0;
  if (arr) prog = 1; else if (dep && s.etd && s.eta) { const a = parseYmd(s.etd), b = parseYmd(s.eta), n = parseYmd(todayStr()); prog = b > a ? Math.min(.96, Math.max(.04, (n - a) / (b - a))) : .5; } else if (dep) prog = .5;
  const po = poById(s.poId);
  const key = dep ? (arr ? null : dday(s.eta)) : dday(s.etd);
  return `<button class="voy" data-act="edit-ship" data-id="${esc(s.id)}">
    <div class="voy-h"><div class="l">${dirTag(poDir(s))}<b class="mono">${esc(s.ref || '출하')}</b><span class="chip">${esc(L(MODES, s.mode || 'sea'))}</span>${exTag(s)}</div><div class="l">${key !== null && key !== undefined && !Number.isNaN(key) ? ddChip(key, num(S.co.alertDays) || 3) : ''}${chipSt(SH_ST, s.status || 'booked')}</div></div>
    <div class="route"><span class="port">${esc(s.pol || '출발지')}</span><div class="track"><b style="width:${(prog * 100).toFixed(1)}%"></b><i style="left:${(prog * 100).toFixed(1)}%"></i></div><span class="port">${esc(s.pod || '도착지')}</span></div>
    <div class="voy-d"><span>ETD<b>${fmtD(s.etd)}</b></span><span>ETA<b>${fmtD(s.eta)}</b></span>${s.docCutoff && !dep ? `<span>서류마감<b>${fmtD(s.docCutoff)}</b></span>` : ''}${po ? `<span>${esc(po.no || '')} · ${esc(po.partnerName || '')}</span>` : ''}${s.vessel ? `<span>${esc(s.vessel)}</span>` : ''}</div>
  </button>`;
}

/* ---------- PO ---------- */
function viewPo() {
  const f = S.poF; const q = f.q.trim().toLowerCase();
  let rows = S.pos.filter(p => !isBill(p));
  if (f.dir !== 'all') rows = rows.filter(p => (p.dir || 'export') === f.dir);
  if (f.st === 'active') rows = rows.filter(isActivePo); else if (f.st === 'closed') rows = rows.filter(p => !isActivePo(p));
  if (q) rows = rows.filter(p => [p.no, p.partnerName, p.memo, ...(p.items || []).map(i => i.desc)].join(' ').toLowerCase().includes(q));
  rows.sort((a, b) => (a.dueDate || '9999').localeCompare(b.dueDate || '9999') || (b.poDate || '').localeCompare(a.poDate || ''));
  const segBtn = (k, v, label, cur) => `<button data-act="filter" data-k="${k}" data-v="${v}" aria-pressed="${cur === v}">${label}</button>`;
  return `
  <div class="page-head"><div><div class="eyebrow">Purchase Orders</div><h1>PO 관리</h1></div><div class="actions"><button class="btn" data-act="ocr" data-kind="order">사진으로 입력</button><button class="btn btn-p" data-act="new-po">${svg('plus')}PO 등록</button></div></div>
  <div class="filters">
    <div class="seg" role="group" aria-label="구분">${segBtn('dir', 'all', '전체', f.dir)}${segBtn('dir', 'export', '수출', f.dir)}${segBtn('dir', 'import', '수입', f.dir)}</div>
    <div class="seg" role="group" aria-label="상태">${segBtn('st', 'active', '진행 중', f.st)}${segBtn('st', 'closed', '완료·취소', f.st)}${segBtn('st', 'all', '전체', f.st)}</div>
    <input id="po-q" class="search" type="search" placeholder="PO 번호, 거래처, 품목 검색" value="${esc(f.q)}" aria-label="PO 검색">
  </div>
  <section class="panel">${rows.length ? `<div class="list">${rows.map(poRow).join('')}</div>` : `<div class="empty">${S.pos.some(p => !isBill(p)) ? '조건에 맞는 PO가 없어요.' : '아직 등록된 PO가 없어요. 바이어에게 받은 PO나 공급사에 낸 발주를 등록해 보세요.'}<button class="btn btn-s" data-act="new-po">PO 등록</button></div>`}</section>`;
}
function poRow(p) {
  const total = poTotal(p), paid = poPaid(p), pct = total > 0 ? Math.min(100, paid / total * 100) : 0;
  const items = (p.items || []).filter(i => i.desc).map(i => i.descKo ? `${i.desc} (${i.descKo})` : i.desc);
  const due = PO_SHIPPED.has(p.status) || !isActivePo(p) ? null : dday(p.dueDate);
  return `<button class="row" data-act="edit-po" data-id="${esc(p.id)}">
    <div style="min-width:0"><div class="row-t">${dirTag(p.dir)}<span class="mono">${esc(p.no || '번호 없음')}</span>${exTag(p)}</div>
    <div class="row-s">${esc(p.partnerName || '거래처 미정')}${items.length ? ' · ' + esc(items[0]) + (items.length > 1 ? ` 외 ${items.length - 1}` : '') : ''}${p.dueDate ? ` · 납기 ${fmtD(p.dueDate)}` : ''}</div></div>
    <div class="row-r"><span class="amt">${money(total, p.currency || 'USD')}</span><span style="display:flex;gap:6px;align-items:center">${ddChip(due)}${chipSt(PO_ST, p.status || 'open')}</span>
    ${total > 0 && p.status !== 'cancel' ? `<span style="display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink-3)">${p.dir === 'import' ? '지급' : '입금'} ${Math.round(pct)}%<span class="paybar"><i style="width:${pct}%"></i></span></span>` : ''}</div>
  </button>`;
}

    ${Object.entries(m.fx).map(([c, v]) => `<div class="tile"><div class="k">그중 ${c}</div><div class="v">${money(v.in - v.out, c)}</div><div class="s">입금 ${fmtNum(v.in, c)} · 출금 ${fmtNum(v.out, c)}</div></div>`).join('')}
  </div>
  ${fxNote(m) ? `<div class="muted" style="font-size:12px;margin-top:-8px">${esc(fxNote(m))} · 계좌끼리 옮긴 돈(환전)과 冲正은 합계에서 빠져요.</div>` : ''}
  <section class="panel"><div class="panel-h"><h2>계좌 잔액</h2><span class="sub">오늘 기준 · 잔액이 찍힌 기록에서 계산</span></div><div class="panel-b">${balancesHTML(accountBalances())}</div></section>
  <section class="panel">${rows.length ? Object.entries(groups).map(([d, list]) => `<div class="day-h">${fmtD(d, true)}</div><div class="list">${list.map(txnRow).join('')}</div>`).join('')
      : `<div class="empty">${ymLabel(ym)} 입출금 기록이 없어요.<br>은행 문자를 복사해 붙여넣거나, 인터넷뱅킹 거래내역 엑셀을 불러오세요.<span class="actions" style="justify-content:center"><button class="btn btn-s" data-act="paste-sms">문자 붙여넣기</button><button class="btn btn-s" data-act="import-file">엑셀 불러오기</button></span></div>`}</section>`;

function txnRow(t) {

  return `<button class="row" data-act="edit-txn" data-id="${esc(t.id)}">
    <div style="min-width:0"><div class="row-t"><span>${esc(t.counterparty || (t.dir === 'in' ? '입금' : '출금'))}</span>${t.category ? `<span class="chip">${esc(CAT_LABEL[t.category] || t.category)}</span>` : '<span class="chip c-warn">미분류</span>'}${exTag(t)}</div>
    <div class="row-s"><span class="mono">${esc(t.time || '')}</span> ${esc(t.bank || '')}${po ? ` · ${esc(po.no)}` : ''}${t.memo ? ' · ' + esc(t.memo) : ''}</div></div>
    <div class="row-r"><span class="amt ${t.dir === 'in' ? 'amt-in' : ''}">${t.dir === 'in' ? '+' : '−'}${money(num(t.amount), cur)}</span>${t.balance !== null && t.balance !== undefined && t.balance !== '' ? `<span class="row-s mono">잔액 ${fmtNum(t.balance, cur)}</span>` : ''}</div>
  </button>`;
}
const monthNav = (key, ym) => `<div class="month"><button class="icon-btn" data-act="month" data-k="${key}" data-v="-1" aria-label="이전 달">${svg('back')}</button><b>${ymLabel(ym)}</b><button class="icon-btn" data-act="month" data-k="${key}" data-v="1" aria-label="다음 달">${svg('chev')}</button></div>`;

/* ---------- report ---------- */
function viewReport() {
  const ym = S.rmonth, m = monthAgg(ym);
  const months = [-5, -4, -3, -2, -1, 0].map(i => addMonths(ym, i));
  const series = months.map(x => { const a = monthAgg(x); return { ym: x, in: a.inK, out: a.outK }; });
  const inCats = CATS.in.map(([k, l]) => [l, m.byCat[k] || 0]).concat(m.byCat._in ? [['미분류', m.byCat._in]] : []).filter(x => x[1]);
  const outCats = CATS.out.map(([k, l]) => [l, m.byCat[k] || 0]).concat(m.byCat._out ? [['미분류', m.byCat._out]] : []).filter(x => x[1]);
  const maxC = Math.max(1, ...inCats.map(x => x[1]), ...outCats.map(x => x[1]));

function chartSvg(series, sel) {
  const W = 640, H = 230, ml = 58, mr = 8, mt = 14, mb = 30, iw = W - ml - mr, ih = H - mt - mb;
  const max = Math.max(1, ...series.map(s => Math.max(s.in, s.out)));
  const step = niceStep(max / 4); const top = Math.ceil(max / step) * step;
  const y = v => mt + ih - v / top * ih;
  const gw = iw / series.length, bw = Math.min(22, gw * .28);
  const bar = (x, v, color) => { const h = Math.max(0, ih - (y(v) - mt)); if (h < .5) return ''; const r = Math.min(4, h, bw / 2); const yt = mt + ih - h, yb = mt + ih; return `<path d="M${x} ${yb}V${yt + r}Q${x} ${yt} ${x + r} ${yt}H${x + bw - r}Q${x + bw} ${yt} ${x + bw} ${yt + r}V${yb}Z" fill="${color}"/>`; };
  let g = '';
  for (let v = 0; v <= top + 1e-6; v += step) g += `<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)" stroke-width="1"/><text x="${ml - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="var(--f-mono)">${krwShort(v)}</text>`;
  series.forEach((s, i) => {
    const cx = ml + gw * i + gw / 2;
    g += bar(cx - bw - 1, s.in, 'var(--s-in)') + bar(cx + 1, s.out, 'var(--s-out)');
    g += `<text x="${cx}" y="${H - 9}" text-anchor="middle" font-size="12" fill="${s.ym === sel ? 'var(--ink)' : 'var(--ink-3)'}" font-weight="${s.ym === sel ? 700 : 400}">${+s.ym.slice(5)}월</text>`;
    g += `<rect class="hit" data-i="${i}" x="${ml + gw * i}" y="${mt}" width="${gw}" height="${ih}" fill="transparent"/>`;
  });
  g += `<line x1="${ml}" x2="${W - mr}" y1="${mt + ih}" y2="${mt + ih}" stroke="var(--line)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 6개월 월별 입금과 출금 막대 차트">${g}</svg><div class="tip" hidden></div>`;
}
function niceStep(raw) { const p = 10 ** Math.floor(Math.log10(Math.max(raw, 1))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function wireChart() {
  const wrap = $('#chart'); if (!wrap) return; const tip = $('.tip', wrap); const svgEl = $('svg', wrap);
  const show = (el) => { const i = +el.dataset.i, s = (window.__chart || [])[i]; if (!s) return; const r = el.getBoundingClientRect(), w = wrap.getBoundingClientRect();
    tip.innerHTML = `<b>${ymLabel(s.ym)}</b>입금 ${money(s.in)}<br>출금 ${money(s.out)}<br>순 ${money(s.in - s.out)}`; tip.hidden = false;
    tip.style.left = Math.min(w.width - 70, Math.max(70, r.left - w.left + r.width / 2 + wrap.scrollLeft)) + 'px'; tip.style.top = (r.top - w.top + 24) + 'px'; };
  $$('.hit', svgEl).forEach(h => { h.addEventListener('pointerenter', () => show(h)); h.addEventListener('click', () => show(h)); });
  svgEl.addEventListener('pointerleave', () => tip.hidden = true);
}

}
const ta = (name, val, rows = 3, ph = '') => `<textarea class="in" name="${name}" id="f-${name.replace(/\W/g, '_')}" rows="${rows}" ${ph ? `placeholder="${esc(ph)}"` : ''}>${esc(val ?? '')}</textarea>`;
const sel = (name, val, opts) => `<select class="in" name="${name}" id="f-${name.replace(/\W/g, '_')}">${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(val ?? '') ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
const radios = (name, val, opts) => `<div class="radio-seg" role="radiogroup">${opts.map(([v, l]) => `<label><input type="radio" name="${name}" value="${esc(v)}" ${v === val ? 'checked' : ''}><span>${esc(l)}</span></label>`).join('')}</div>`;
function readForm(root) {
  const o = {};
  $$('[name]', root).forEach(el => {
    if (el.closest('.it-row')) return;
    const k = el.name;
    if (el.type === 'checkbox') o[k] = el.checked;
    else if (el.type === 'radio') { if (el.checked) o[k] = el.value; }
    else if (el.type === 'number') o[k] = el.value === '' ? '' : Number(el.value);

  return o;
}
const poOptions = (val, dir) => [['', '— 연결 안 함 —'], ...S.pos.filter(p => !isBill(p)).filter(p => !dir || (p.dir || 'export') === dir || p.id === val).sort((a, b) => (b.poDate || '').localeCompare(a.poDate || '')).map(p => [p.id, `${p.no || '번호 없음'} · ${p.partnerName || ''}`])];

function readItems(root) {

const PT_KIND = [['buyer', '고객 · 우리가 받는 곳'], ['supplier', '공급사 · 우리가 주는 곳'], ['forwarder', '물류 · 포워더'], ['etc', '기타 · 서비스']];

/* bank details printed on invoices, contracts, business cards */
const BANK_LBL = '(?:HOLDER\\s*NAME|ACCOUNT\\s*HOLDER|BENEFICIARY\\s*BANK|BENEFICIARY(?:\\s*NAME)?|ACCOUNT\\s*NAME|A\\/C\\s*NAME|BANK\\s*NAME|BANK\\s*ADDRESS|A\\s*[/\\\\VNIl1|]\\s*C\\s*NO\\.?(?:\\s*\\([A-Z]{3}\\))?|ACCOUNT\\s*(?:NO\\.?|NUMBER)(?:\\s*\\([A-Z]{3}\\))?|ACCT\\.?\\s*NO\\.?|IBAN|SWIFT(?:\\s*\\/?\\s*BIC)?(?:\\s*CODE)?|收款人(?:名称|户名)?|收款单位|账户名称|户\\s*名|开户名称?|开户(?:银)?行(?:名称)?|银行名称|收款银行|银行地址|银行账号|收款账号|账\\s*号|帐\\s*号|银行卡号|卡\\s*号|예금주|은행\\s*명|계좌\\s*번호)';

/* names, phones, addresses, bank accounts from any pasted text */
const ocrTrim = n => String(n || '').replace(/^[^A-Za-z0-9\u4e00-\u9fff]*(?:[A-Za-z]{1,2}\s*[）)\]】」|:：,，.]\s*)?(?=[\u4e00-\u9fff])/, '').trim();
const snapHolder = (banks, ...names) => (banks || []).forEach(b => { const h = String(b.holder || ''); if (!h) return; for (const n of names.filter(Boolean)) { if (h !== n && Math.abs(h.length - n.length) <= 1 && h.length >= 6 && levD(h, n) <= 2) { b.holder = n; return; } } });
function parsePartnerText(text) {

  const nm = ([...t.matchAll(/(?:公司名称|单位名称|名\s*称|COMPANY(?:\s*NAME)?|상\s*호|회사명)\s*[:：]\s*([^\n]{3,80})/gi)].map(m => m[1].trim()).find(x => !isOurs(x))) || '';

  const hanOf = x => /[一-鿿]/.test(x || '');
  const alt = lines.find((l, k) => k !== nameLine && COMPANY_RE.test(l) && l.length <= 70 && !isOurs(l) && !/(BANK|银行|BENEFICIARY|收款|开户|ADDRESS|地址|HOLDER|户名|^TO\b|^致)/i.test(l) && hanOf(l) !== hanOf(o.name));

}
/* merge found details into a partner without overwriting what the user typed */
function mergePartnerInfo(pt, info) {

/* text out of a PDF the user picked */
async function docText(f, msgEl) {
  const say = t => { if (msgEl) msgEl.textContent = t; };
  if (!(/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name))) {
    if (!ocrHere()) { say('사진은 사진 앱에서 글자를 길게 눌러 모두 선택 → 복사한 뒤 위 칸에 붙여넣어 주세요.'); return ''; }
    try { const r = await readPhoto(f, say); say(r.text.trim() ? '사진에서 읽었어요. 틀린 글자는 고쳐 주세요.' : '사진에서 글자를 찾지 못했어요.'); return r.text; }
    catch (e) { say('사진 읽기 엔진을 받지 못했어요. 인터넷 연결을 확인해 주세요.'); return ''; }
  }
  say('PDF 읽는 중…');
  try { const r = await readPdf(f, 0); if (!r.text.trim()) { say('이 PDF에는 글자가 없어요(스캔본). 사진처럼 글자를 복사해 붙여넣어 주세요.'); return ''; } say('PDF에서 읽었어요.'); return r.text; }
  catch (e) { say('PDF를 읽지 못했어요.'); return ''; }
}

        if (res.logo) patch.logo = res.logo; if (res.stamp) patch.stamp = res.stamp;

      };
    }
  });
}

/* ================= bills: invoices / debit notes / 账单 that ask for money (줄 돈) or that we sent (받을 돈) ================= */
const isBill = p => !!p && p.kind === 'bill';
const BILL_ST = [['open', '결제 전'], ['done', '완료'], ['cancel', '취소']];
const dueTag = due => !due ? '' : due.dflt ? ` (조건 없음 · 발행일+${due.days}일)` : due.est ? ' (추정)' : '';
const ourNames = () => { const co = S.co; return [co.nameEn, co.nameZh, co.nameKo, (co.brand || '').length >= 4 ? co.brand : ''].filter(Boolean).map(x => x.replace(/[\s.,()（）]/g, '').toLowerCase()); };
const isOurs = n => { const k = String(n || '').replace(/[\s.,()（）]/g, '').toLowerCase(); return !!k && k.length >= 3 && ourNames().some(o => o && (k.includes(o) || (o.includes(k) && k.length >= 6))); };
const COMPANY_RE = /(LIMITED|LTD\.?|CO\.,?\s*LTD|CORPORATION|CORP\.?|INC\.?|LLC|GMBH|有限公司|有限责任公司|股份公司|公司|商行|株式会社|주식회사|\(주\)|㈜)/i;
const BILL_TITLE = /\b(INVOICE|DEBIT\s*NOTE|BILL(?:ING)?\s*STATEMENT|STATEMENT OF ACCOUNT|PAYMENT REQUEST|PAYMENT NOTICE)\b|请款单|请款|付款通知|付款申请|账单|对账单|费用(确认|结算)单|结算单|增值税(专用|普通|电子)?发票|电子发票|发票|發票|청구서|세금계산서|거래명세서|請求書/i;
function parseBillText(text) {
  const raw = String(text || '').replace(/\r/g, '');
  const lines = raw.split('\n').map(s => s.replace(/[ \t\u3000]+/g, ' ').trim()).filter(Boolean);
  const all = lines.join('\n');
  const title = (all.match(BILL_TITLE) || [''])[0];
  if (!title) return null;
  const amt = s => { const m = String(s || '').match(/-?[\d,]+\.\d{2}\b|-?\d{1,3}(?:,\d{3})+(?!\.\d)\b/g); return m ? parseNum(m[m.length - 1]) : 0; };
  // total: prefer "amount due / 应付 / 价税合计(小写)" over a plain TOTAL line
  const pick = [
    /(AMOUNT\s*DUE|BALANCE\s*DUE|TOTAL\s*DUE|AMOUNT\s*PAYABLE|PLEASE\s*PAY|应付金额|本期应付|应付合计|请款金额|청구\s*금액|청구액)/i,
    /(价税合计|（小写）|\(小写\)|小写)/,
    /(GRAND\s*TOTAL|TOTAL\s*AMOUNT|INVOICE\s*TOTAL|合\s*计|总\s*计|总金额|합계\s*금액|총\s*액|TOTAL)/i
  ];
  let total = 0, totalLine = '';
  for (const re of pick) {
    for (let i = 0; i < lines.length && !total; i++) {
      if (!re.test(lines[i]) || /SUB\s*-?\s*TOTAL|小计/i.test(lines[i]) || (/大写/.test(lines[i]) && !/小写/.test(lines[i]))) continue;
      let v = amt(lines[i]), pre = ''; if (!v && lines[i + 1] && !/[A-Za-z一-龥]{3,}/.test(lines[i + 1])) v = amt(lines[i + 1]);
      if (!v && i > 0 && /[\d,]+\.\d{2}\s*$/.test(lines[i - 1]) && !/TOTAL|合计|总计|小计/i.test(lines[i - 1])) { v = amt(lines[i - 1]); pre = lines[i - 1] + ' '; }
      if (v > 0) { total = v; totalLine = pre + lines[i] + ' ' + (lines[i + 1] || ''); }
    }
    if (total) break;
  }
  if (!(total > 0)) return null;
  // currency
  const curOf = s => { const m = String(s).match(/\b(USD|CNY|RMB|EUR|JPY|KRW|HKD|GBP)\b|US\$|人民币|￥|¥|元|원|₩|\$/i); if (!m) return ''; const k = m[0].toUpperCase(); return { RMB: 'CNY', '人民币': 'CNY', '￥': 'CNY', '¥': 'CNY', '元': 'CNY', '원': 'KRW', '₩': 'KRW', 'US$': 'USD', '$': 'USD' }[k] || k; };
  const currency = curOf(totalLine) || curOf(all) || BASE();
  // parties
  const toRe = /^(?:BILL\s*TO|SOLD\s*TO|INVOICE\s*TO|TO|MESSRS\.?|CUSTOMER|ATTN\.?|致|客户(?:名称)?|付款(?:方|单位)|购\s*买\s*方(?:信息)?(?:\s*名\s*称)?|购货单位|공급\s*받는\s*자(?:\s*상호)?)\s*[:：]?\s*(.+)$/i;
  let billTo = '';
  for (const l of lines) { const m = l.match(toRe); if (m) { const v = m[1].replace(/^(名\s*称|상호)\s*[:：]?\s*/, '').replace(/\s+(JOB|DEBIT|INVOICE|ISSUE|DATE|SO|P\.?O|B\/?L|REF|NO)\b.*$/i, '').replace(/\s+[A-Z]{1,6}\d{6,}\S*$/, '').trim(); if (v && !/^[:：]$/.test(v)) { billTo = v.slice(0, 80); break; } } }
  const named = [...all.matchAll(/名\s*称\s*[:：]\s*([^\n:：]{4,50}?(?:公司|厂|店|部|中心|事务所|商行))/g)].map(m => m[1].trim());
  const sellerRe = /^(?:FROM|销\s*售\s*方(?:信息)?(?:\s*名\s*称)?|开票方|收款(?:方|单位|人)|BENEFICIARY|공급자(?:\s*상호)?)\s*[:：]?\s*(.+)$/i;
  let issuer = '';
  for (const l of lines) { const m = l.match(sellerRe); if (m && COMPANY_RE.test(m[1])) { issuer = m[1].replace(/^(名\s*称|상호)\s*[:：]?\s*/, '').trim().slice(0, 80); break; } }
  if (named.length >= 2) { if (!billTo) billTo = named[0]; if (!issuer) issuer = named[1]; }
  if (!issuer) { const top = lines.slice(0, 12).find(l => COMPANY_RE.test(l) && !toRe.test(l) && !(billTo && l.includes(billTo)) && l.length <= 80 && !/(BANK|银行)/i.test(l)); if (top) issuer = top.replace(/^(FROM|发自)\s*[:：]?\s*/i, '').trim(); }
  issuer = ocrTrim(issuer);
  const usIssuer = isOurs(issuer), usTo = isOurs(billTo);
  const hanOf = x => /[一-鿿]/.test(x || '');
  const issuerAlt = issuer ? (lines.slice(0, 12).find(l => l !== issuer && COMPANY_RE.test(l) && !toRe.test(l) && !(billTo && l.includes(billTo)) && l.length <= 80 && !isOurs(l) && !/(BANK|银行)/i.test(l) && hanOf(l) !== hanOf(issuer)) || '').trim() : '';
  const charges = []; { const hi = lines.findIndex(l => /^(DESCRIPTION|项目|品名|费用名称|费用项目|ITEM|CHARGE)/i.test(l) && /(AMOUNT|金额)/i.test(l)); for (let k = hi + 1; hi >= 0 && k < lines.length && charges.length < 20; k++) { const l = lines[k]; if (/TOTAL|合计|总计|REMARK|备注/i.test(l)) break; const mm = l.match(/^([A-Za-z一-鿿][^\d]{1,60}?)\s+[\d*].*?([\d,]+\.\d{2})\s*$/); if (mm) charges.push({ desc: mm[1].trim(), amt: parseNum(mm[2]) }); } }
  const ti = lines.findIndex(l => BILL_TITLE.test(l)); const head = lines.slice(0, ti > 2 ? ti : 8).join('\n');
  const dir = usIssuer && !usTo ? 'export' : 'import';
  const partnerName = dir === 'export' ? billTo : issuer;
  // numbers: invoice / debit no, and other references (B/L, job, PO)
  const codeRe = /\b[A-Z]{1,8}[-_]?\d{4,}[\w\-\/]*\b/g;
  const codes = [...new Set((all.match(codeRe) || []).filter(c => !/^(TEL|FAX|USD|CNY|RMB|HKD|ROOM|RM|NO)\d*$/i.test(c)))];
  let no = '';
  const noLine = all.match(/(?:INVOICE|DEBIT(?:[ \t]*NOTE)?|BILL|STATEMENT)[ \t]*(?:NO\.?|NUMBER|#)[ \t]*[:：]?[ \t]*([A-Za-z0-9][\w\-\/]{3,40})/i) || all.match(/(?:发票号码|发票号|单[ \t]*号|账单号|编[ \t]*号|청구[ \t]*번호|문서[ \t]*번호)[ \t]*[:：]?[ \t]*([A-Za-z0-9][\w\-\/]{3,40})/);
  if (noLine && /\d/.test(noLine[1])) no = noLine[1];
  if (!no) no = codes.find(c => /-(D|INV|DN|C)\d+$/i.test(c)) || codes.find(c => /INV/i.test(c)) || codes[0] || '';
  const refs = codes.filter(c => c !== no && !(no && no.includes(c)));
  // dates
  const dates = []; const dRe = /(\d{4})\s*[-./年]\s*(\d{1,2})\s*[-./月]\s*(\d{1,2})\s*日?/g; let dm;
  while ((dm = dRe.exec(all))) { const s = `${dm[1]}-${pad2(dm[2])}-${pad2(dm[3])}`; if (isYmd(s) && +dm[2] <= 12 && +dm[3] <= 31) dates.push({ s, at: dm.index }); }
  const dueM = all.match(/(?:DUE\s*DATE|PAYMENT\s*DUE|DUE\s*ON|PAY(?:ABLE)?\s*BY|PLEASE\s*PAY\s*(?:BEFORE|BY)|付款期限|最迟付款日|最晚付款日|到期日|付款日期|请于|지급\s*기한|결제\s*기한|납부\s*기한|입금\s*기한)[^\n\d]{0,12}(\d{4}\s*[-./年]\s*\d{1,2}\s*[-./月]\s*\d{1,2})/i);
  const payDue = dueM ? parseAnyDate(dueM[1]) || '' : '';
  const issueM = all.match(/(?:ISSUE\s*DATE|INVOICE\s*DATE|DATE\s*OF\s*ISSUE|开票日期|开具日期|日\s*期|발행일|작성일자?)[^\n\d]{0,12}(\d{4}\s*[-./年]\s*\d{1,2}\s*[-./月]\s*\d{1,2})/i);
  const date = (issueM && parseAnyDate(issueM[1])) || (dates.find(d => d.s !== payDue) || {}).s || todayStr();
  const termsM = all.match(/(?:PAYMENT\s*TERMS?|TERMS)\s*[:：]?\s*((?:NET\s*\d+|\d+\s*DAYS?)[^\n]{0,30})/i) || all.match(/(月结\s*\d+\s*天|票到\s*\d+\s*天[^\n]{0,10}|开票后\s*\d+\s*天)/);
  // bank details printed on the bill (where to pay)
  const bankLines = lines.filter(l => /(A\/C|ACCOUNT|账\s*号|帳號|开户行|開戶行|BANK\s*NAME|SWIFT|BENEFICIARY|HOLDER|户\s*名|收款人|예금주|계좌)/i.test(l) && /[\dA-Z一-龥]{3,}\s*$/.test(l.replace(/[:：]\s*$/, '')) && !/^\s*[A-Z ]+\s*[:：]?\s*$/.test(l)).slice(0, 5);
  // what the money is for
  const logi = /(VSL|VESSEL|B\/?L\s*NO|BL\s*NO|P\.?O\.?L|P\.?O\.?D|FREIGHT|OCEAN|CBM|THC|LOGISTICS|SHIPPING|FORWARD|运费|海运|空运|货代|报关|拖车|仓储|物流|港杂|운임|물류|통관)/i.test(all);
  const duty = /(关税|进口增值税|CUSTOMS\s*DUTY|IMPORT\s*DUTY|관세)/i.test(all);
  const rent = /(租金|房租|物业|管理费|RENT|임대료|월세|관리비)/i.test(all);
  const category = dir === 'export' ? 'sales' : duty ? 'customs' : logi ? 'logistics' : rent ? 'rent' : /增值税|发票|세금계산서|INVOICE/i.test(title) ? 'purchase' : 'expense';
  const ship = S.ships.find(s => codes.concat(no).some(c => c && [s.blNo, s.ref, s.bookingNo].filter(Boolean).some(x => String(x).toUpperCase() === c.toUpperCase())));
  const po = S.pos.find(p => !isBill(p) && p.no && codes.some(c => c.toUpperCase() === String(p.no).toUpperCase())) || (ship && ship.poId ? poById(ship.poId) : null);
  const vsl = (all.match(/(?:VSL\s*NM|VESSEL)[^\n]*?([A-Z][A-Z .]+V\.?\s*\/?\s*\w+)/i) || [])[1];
  const route = [(all.match(/P\.O\.L\s*[:：]?\s*([A-Z ,]{4,30})/) || [])[1], (all.match(/P\.O\.D\s*[:：]?\s*([A-Z ,]{4,30})/) || [])[1]].filter(Boolean).map(x => x.trim());
  const descWord = { logistics: '물류비', customs: '관세·통관', rent: '임차료', purchase: '매입', expense: '경비', sales: '매출 청구' }[category];
  const memo = [ship ? `출하 ${ship.ref || ''}${ship.blNo ? ' · B/L ' + ship.blNo : ''}` : '', vsl ? `선박 ${vsl.trim()}` : '', route.length === 2 ? route.join(' → ') : '', billTo && !usTo && dir === 'import' ? `청구서 수신처: ${billTo}` : ''].filter(Boolean).join(' · ');
  return {
    kind: 'bill', dir, no, partnerName: (partnerName || '').slice(0, 80), billTo, issuer, toOther: dir === 'import' && !!billTo && !usTo, title: title.toUpperCase(),
    poDate: date, payDue, payTerms: termsM ? termsM[1].trim() : '', currency, total, category,
    items: charges.length > 1 && Math.abs(sumBy(charges, c => c.amt) - total) <= Math.max(0.05, total * 0.005) ? charges.map(c => ({ desc: c.desc, descKo: '', spec: '', hs: '', qty: 1, unit: '', price: c.amt })) : [{ desc: `${descWord}${no ? ' · ' + no : ''}${charges.length ? ' (' + charges.map(c => c.desc).slice(0, 4).join(', ') + ')' : ''}`, descKo: '', spec: '', hs: '', qty: 1, unit: '', price: total }], issuerAlt,
    refPo: po ? po.no : (ship && ship.blNo) || refs[0] || '', poLink: po ? po.id : '', shipId: ship ? ship.id : '', supBank: bankLines.join('\n'), memo, status: 'open', source: 'ocr',
    ptInfo: dir === 'import' ? Object.assign((() => { const o = parsePartnerText(head); delete o.name; delete o.banks; delete o.nameAlt; return o; })(), { banks: (bk => (snapHolder(bk, issuer, issuerAlt), bk))(parseBanks(all)) }, issuerAlt ? { nameAlt: issuerAlt } : {}) : {}
  };
}

    ${F('분류 (결제할 때 쓰는 항목)', sel('category', p.category || (ap ? 'expense' : 'sales'), cats))}

    ${F('결제 조건', inp('payTerms', p.payTerms, { ph: '예: 月结30天, NET 15' }))}${F('관련 PO · B/L', inp('refPo', p.refPo, { mono: 1 }))}
    ${ap ? F('지급할 계좌 (청구서에 적힌 것)', ta('supBank', p.supBank, 2), 'full') : ''}

/* calendar reminders (.ics): the phone's own calendar gives the push alert */
function icsText(evs) {
  const z = n => String(n).padStart(2, '0');
  const now = new Date(); const stamp = `${now.getUTCFullYear()}${z(now.getUTCMonth() + 1)}${z(now.getUTCDate())}T${z(now.getUTCHours())}${z(now.getUTCMinutes())}00Z`;
  const tx = s => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1');
  const fold = l => { const out = []; let s = l; while (s.length > 72) { out.push(s.slice(0, 72)); s = ' ' + s.slice(72); } out.push(s); return out.join('\r\n'); };

async function sealify(file) {
